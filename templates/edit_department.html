{% extends 'base.html' %}

{% block title %}Edit Department | Central Hub{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4">

            <h4 class="fw-bold mb-4 text-center">Edit Department</h4>

            <form method="POST">
                {% csrf_token %}

                <!-- Department Name -->
                <div class="mb-3">
                    <label class="form-label">Department Name</label>
                    <input type="text" 
                           name="department_name"
                           value="{{ department.department_name }}"
                           class="form-control"
                           required>
                </div>

                <!-- Teacher Dropdown -->
                <div class="mb-3">
                    <label class="form-label">Teacher In Charge</label>
                    <select name="teacher_in_charge" class="form-select">
                        <option value="">Select Teacher</option>

                        {% for teacher in teachers %}
                            <option value="{{ teacher.pk }}"
                                {% if department.teacher_in_charge and department.teacher_in_charge.pk == teacher.pk %}
                                    selected
                                {% endif %}
                            >
                                {{ teacher.username }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Buttons -->
                <div class="text-center">
                    <button type="submit" class="btn btn-success">
                        Update
                    </button>

                    <a href="{% url 'department_list' %}" class="btn btn-secondary">
                        Cancel
                    </a>
                </div>

            </form>

        </div>
    </div>
</div>

{% endblock %}

{% extends 'base.html' %}
{% block title %}Login | Central Hub{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-body">

                <!-- Tabs -->
                <ul class="nav nav-tabs mb-3" id="loginTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" 
                                id="principal-tab" 
                                data-bs-toggle="tab" 
                                data-bs-target="#principal" 
                                type="button">
                            Principal
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" 
                                id="staff-tab" 
                                data-bs-toggle="tab" 
                                data-bs-target="#staff" 
                                type="button">
                            Staff
                        </button>
                    </li>
                </ul>

                <div class="tab-content">

                    <!-- PRINCIPAL LOGIN -->
                    <div class="tab-pane fade show active" id="principal">

                        <h5 class="text-center mb-3">Principal Login</h5>

                        <form method="POST">
                            {% csrf_token %}
                            <input type="hidden" name="role" value="principal">

                            <div class="mb-3">
                                <label>Username</label>
                                <input type="text" name="username" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label>Password</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                Login as Principal
                            </button>
                        </form>
                    </div>

                    <!-- STAFF LOGIN -->
                    <div class="tab-pane fade" id="staff">

                        <h5 class="text-center mb-3">Staff Login</h5>

                        <form method="POST">
                            {% csrf_token %}
                            <input type="hidden" name="role" value="staff">

                            <div class="mb-3">
                                <label>Username</label>
                                <input type="text" name="username" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label>Password</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>

                            <button type="submit" class="btn btn-success w-100">
                                Login as Staff
                            </button>
                        </form>
                    </div>

                </div>

                <!-- Error Messages -->
                {% if messages %}
                    <div class="mt-3">
                        {% for message in messages %}
                            <div class="alert alert-danger">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}

            </div>
        </div>

    </div>
</div>

{% endblock %}

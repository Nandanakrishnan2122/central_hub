{% extends 'base.html' %}
{% block title %}Issue Analytics | Central Hub{% endblock %}

{% block content %}

<h3 class="text-center mb-4 fw-bold">Issue Status Distribution</h3>

<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <canvas id="issueChart"></canvas>
    </div>
</div>

<!-- 🔥 Button -->
<div class="text-center mt-4">
    <a href="{% url 'issue_list' %}" 
       class="btn btn-outline-success px-4 shadow-sm">
        View Issue List
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const chartData = JSON.parse('{{ chart_data|escapejs }}');

const pending = chartData.pending;
const solved = chartData.solved;

const total = pending + solved;
const solvedPercent = total > 0 ? ((solved / total) * 100).toFixed(1) : 0;

// 🔥 Center Text Plugin
const centerTextPlugin = {
    id: 'centerText',
    beforeDraw(chart) {
        const { width, height, ctx } = chart;

        ctx.restore();

        ctx.font = "700 20px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#2f7b63";

        ctx.fillText(solvedPercent + "%", width / 2, height / 2 - 6);

        ctx.font = "500 12px sans-serif";
        ctx.fillStyle = "#555";
        ctx.fillText("Solved", width / 2, height / 2 + 14);

        ctx.save();
    }
};

const ctx = document.getElementById('issueChart');

// 🔥 Start from tiny values (for draw animation)
const myChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
        labels: ['Pending', 'Solved'],
        datasets: [{
            data: [0.01, 0.01],
            backgroundColor: ['#dc3545', '#2f7b63']
        }]
    },
    options: {
        cutout: '70%',
        rotation: -90,
        animation: {
            duration: 1200,
            easing: 'easeOutCubic'
        },
        plugins: {
            legend: {
                position: 'bottom'
            }
        }
    },
    plugins: [centerTextPlugin]
});

// 🔥 Animate to real values
setTimeout(() => {
    myChart.data.datasets[0].data = [pending, solved];
    myChart.update();
}, 100);

</script>

{% endblock %}

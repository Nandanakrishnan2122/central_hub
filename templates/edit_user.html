{% extends 'base.html' %}

{% block title %}Edit User | Central Hub{% endblock %}

{% block content %}
<div class="form-page-layout form-page-container">
    <div class="form-page-panel">
        <div class="form-page-header">
            <h4 class="fw-bold mb-0">Edit User</h4>
            <a href="{% url 'user_list' %}" class="btn btn-secondary btn-sm">Back</a>
        </div>

        <form method="POST" class="row g-3">
            {% csrf_token %}

            <div class="col-md-6">
                <label class="form-label">Username</label>
                <input type="text"
                       name="username"
                       class="form-control"
                       value="{{ user_obj.username }}"
                       required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email"
                       name="email"
                       class="form-control"
                       value="{{ user_obj.email }}"
                       required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Department</label>
                <select name="department" class="form-select" required>
                    {% for dept in departments %}
                        <option value="{{ dept.department_id }}"
                            {% if user_obj.department == dept %}selected{% endif %}>
                            {{ dept.department_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Designation</label>
                <select name="designation" class="form-select" required>
                    {% for des in designations %}
                        <option value="{{ des.des_id }}"
                            {% if user_obj.designation == des %}selected{% endif %}>
                            {{ des.designation }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-12 form-page-footer d-flex justify-content-between align-items-center">
                <a href="{% url 'user_list' %}" class="btn btn-secondary">
                    Cancel
                </a>
                <button type="submit" class="btn btn-primary">
                    Update User
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

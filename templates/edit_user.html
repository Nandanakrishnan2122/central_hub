{% extends 'base.html' %}

{% block title %}Edit User{% endblock %}

{% block content %}

<div class="container mt-4">
    <div class="card p-4 shadow-sm">

        <h4 class="text-center mb-4">Edit User</h4>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label>Username</label>
                {{ form.username }}
            </div>

            <div class="mb-3">
                <label>Email</label>
                {{ form.email }}
            </div>

            <div class="mb-3">
                <label>Phone</label>
                {{ form.phone }}
            </div>

            <div class="mb-3">
                <label>DOB</label>
                {{ form.dob }}
            </div>

            <div class="mb-3">
                <label>Address</label>
                {{ form.address }}
            </div>

            

            

            <!-- Image -->
            <div class="mb-3">
                <label>Profile Image</label>
                {{ form.profile_image }}
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary">Update</button>
                <a href="{% url 'user_details' form.instance.user_id %}" class="btn btn-secondary">Cancel</a>
            </div>

        </form>

    </div>
</div>

{% endblock %}

{% extends 'base.html' %}

{% block title %}Edit Device | Central Hub{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4">

            <h4 class="fw-bold mb-4 text-center">Edit Device</h4>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Label No</label>
                    {{ form.label_no }}
                </div>

                <div class="mb-3">
                    <label class="form-label">Device Type</label>
                    {{ form.device_type }}
                </div>

                <div class="mb-3">
                    <label class="form-label">Specification</label>
                    {{ form.device_specification }}
                </div>

                <div class="mb-3">
                    <label class="form-label">Brand</label>
                    {{ form.device_brand }}
                </div>

                <div class="mb-3">
                    <label class="form-label">Model</label>
                    {{ form.device_model }}
                </div>

                <div class="mb-3">
                    <label class="form-label">Status</label>
                    {{ form.status }}
                </div>

                <div class="text-center mt-3">
                    <button type="submit" class="btn btn-success">
                        Update Device
                    </button>

                    <a href="{% url 'device_list' %}" class="btn btn-secondary">
                        Cancel
                    </a>
                </div>

            </form>

        </div>
    </div>
</div>

{% endblock %}

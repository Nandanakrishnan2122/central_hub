{% extends 'base.html' %}

{% block title %}Edit Solved Issue{% endblock %}

{% block content %}

<div class="container">
    <div class="card shadow p-4">
        <h4 class="fw-bold mb-4 text-center">Edit Solved Issue</h4>

        <form method="POST">
            {% csrf_token %}

            <!-- Device (Readonly) -->
            <div class="mb-3">
                <label class="form-label">Device</label>
                <input type="text"
                       class="form-control"
                       value="{{ issue.device.label_no }}"
                       readonly>
            </div>

            <!-- Problem Description -->
            <div class="mb-3">
                <label class="form-label">Problem Description</label>
                <textarea name="issue_description"
                          class="form-control"
                          required>{{ issue.issue_description }}</textarea>
            </div>

            <!-- Repaired Description -->
            <div class="mb-3">
                <label class="form-label">Repaired Description</label>
                <textarea name="repaired_description"
                          class="form-control"
                          required>{{ issue.repaired_description }}</textarea>
            </div>

            <!-- Cost -->
            <div class="mb-3">
                <label class="form-label">Cost</label>
                <input type="number"
                       step="0.01"
                       name="cost"
                       value="{{ issue.cost }}"
                       class="form-control"
                       required>
            </div>

            <!-- Repaired Date -->
            <div class="mb-3">
                <label class="form-label">Repaired Date</label>
                <input type="date"
                       name="repaired_date"
                       value="{{ issue.repaired_date|date:'Y-m-d' }}"
                       class="form-control">
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-success">
                    Update
                </button>

                <a href="{% url 'solved_issue_list' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>
            </div>

        </form>
    </div>
</div>

{% endblock %}

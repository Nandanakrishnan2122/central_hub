{% extends 'base.html' %}

{% block title %}Solve Issue | Central Hub{% endblock %}

{% block content %}

<div class="table-page-layout table-page-container">
    <div class="table-page-panel">

        <h4 class="fw-bold mb-4 text-center">Solved Issue</h4>

        <div class="table-responsive mb-3">
        <table class="table table-bordered align-middle">
            <tr>
                <th>Device</th>
                <td>{{ issue.device.label_no }}</td>
            </tr>
            <tr>
                <th>Reported Date</th>
                <td>{{ issue.report_date }}</td>
            </tr>
            <tr>
                <th>problem</th>
                <td>{{ issue.issue_description }}</td>
            </tr>
        </table>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label"> Description</label>
                <textarea name="solution_description" 
                          class="form-control" required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Expense</label>
                <input type="number" step="0.01" 
                       name="cost" 
                       class="form-control" required>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-success">
                    Confirm 
                </button>

                <a href="{% url 'device_issues' issue.device.device_id %}" 
                class="btn btn-secondary">
                    Cancel
                </a> 
            </div>

        </form>

    </div>
</div>

{% endblock %}

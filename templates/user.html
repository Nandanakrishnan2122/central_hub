{% extends 'base.html' %}

{% block content %}
<h4 class="fw-bold mb-4 text-center">Report Issue</h4>

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow-sm p-4">

            <p><strong>Device:</strong> {{ device.label_no }}</p>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Issue Description</label>
                    {{ form.issue_description }}
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-danger">
                        Submit Issue
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>
{% endblock %}

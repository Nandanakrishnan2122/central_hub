{% extends 'base.html' %}

{% block title %}Add Device | Central Hub{% endblock %}

{% block content %}
<h4 class="fw-bold mb-4 text-center">Add New Device</h4>

<div class="row justify-content-center">
    <div class="col-md-6">

        <form method="post" enctype="multipart/form-data" class="card shadow-sm p-4">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Device Name (Label No)</label>
                <input type="text" name="label_no" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Device Type</label>
                {{ form.device_type }}
            </div>

            <div class="mb-3">
                <label class="form-label">Brand</label>
                {{ form.device_brand }}
            </div>

            <div class="mb-3">
                <label class="form-label">Model</label>
                {{ form.device_model }}
            </div>

            <div class="mb-3">
                <label class="form-label">Status</label>
                {{ form.status }}
            </div>

            <div class="mb-3">
                <label class="form-label">Device Image (Optional)</label>
                {{ form.device_image }}
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary">
                    Save Device
                </button>
            </div>

        </form>

    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Add Department | Central Hub{% endblock %}

{% block content %}
<div class="form-page-layout form-page-container">
    <div class="form-page-panel">
        <div class="form-page-header">
            <h4 class="fw-bold mb-0">Add New Department</h4>
            <a href="{% url 'department_list' %}" class="btn btn-secondary btn-sm">Back</a>
        </div>

        {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" class="row g-3">
            {% csrf_token %}

            <div class="col-md-6">
                <label class="form-label">Department Name</label>
                <input type="text"
                       name="department_name"
                       class="form-control"
                       value="{{ request.POST.department_name }}"
                       required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Teacher In Charge</label>
                <select name="teacher_in_charge" class="form-select">
                    <option value="">Select Teacher</option>

                    {% for teacher in teachers %}
                        <option value="{{ teacher.pk }}"
                            {% if request.POST.teacher_in_charge == teacher.pk|stringformat:"s" %}
                                selected
                            {% endif %}
                        >
                            {{ teacher.username }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-12 form-page-footer d-flex justify-content-between align-items-center">
                <a href="{% url 'department_list' %}" class="btn btn-secondary">
                    Cancel
                </a>
                <button type="submit" class="btn btn-primary">
                    Save Department
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
